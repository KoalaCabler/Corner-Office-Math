# Refreshes the data from SEC EDGAR every Monday and commits any changes.
# Render redeploys automatically when the commit lands.
#
# One-time setup: repository Settings > Secrets and variables > Actions >
# New repository secret, name SEC_USER_AGENT, value e.g.
# "Corner Office Math you@example.com" (the SEC requires a contact email).
name: Update data

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Only these tickers (comma separated, optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test parsers
        run: npm test
      - name: Update data
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            node scripts/update-data.js --only "${{ github.event.inputs.only }}"
          else
            node scripts/update-data.js --budget-minutes 320
          fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update data from SEC EDGAR"
            git pull --rebase origin main
            git push
          fi
